<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Pix</title>
  <style>
    :root {
      --pix: #00a884;
      --pix-dark: #007f68;
      --bg: #f3f7f6;
      --card: #fff;
      --text: #17211f;
      --muted: #687572;
      --border: #dfe8e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(145deg, #e9f8f3, var(--bg));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 16px 50px rgba(0,0,0,.10);
      text-align: center;
    }
    .logo {
      width: 58px;
      height: 58px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: var(--pix);
      display: grid;
      place-items: center;
      color: white;
      font-size: 28px;
      font-weight: 800;
    }
    h1 { margin: 0 0 5px; font-size: 25px; }
    .subtitle { color: var(--muted); margin: 0 0 22px; }
    .amount {
      font-size: 31px;
      font-weight: 800;
      margin: 12px 0 4px;
    }
    .city { color: var(--muted); margin-bottom: 20px; }
    #qrcode {
      width: 250px;
      height: 250px;
      margin: 0 auto 18px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    #qrcode img, #qrcode canvas { max-width: 100%; max-height: 100%; }
    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      margin: 12px 0 6px;
    }
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: var(--pix); }
    .pix-box {
      display: flex;
      gap: 8px;
    }
    .pix-box input {
      min-width: 0;
      font-size: 12px;
      background: #f7faf9;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
    }
    button:hover { transform: translateY(-1px); }
    .primary { background: var(--pix); color: white; }
    .primary:hover { background: var(--pix-dark); }
    .secondary { background: #edf4f2; color: var(--text); }
    .whatsapp { background: #25D366; color: white; }
    .hint {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 16px;
    }
    .status {
      min-height: 18px;
      font-size: 13px;
      color: var(--pix-dark);
      margin-top: 8px;
    }
    .fixed-info {
      background: #f7faf9;
      border-radius: 12px;
      padding: 11px;
      font-size: 13px;
      text-align: left;
      margin-bottom: 14px;
    }
    .fixed-info b { display: block; margin-bottom: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">₿</div>
    <h1>Pagamento via Pix</h1>
    <p class="subtitle">Aponte a câmera ou copie o código</p>

    <div class="fixed-info">
      <b>Recebedor</b>
      <span id="recipient">SEU NOME</span>
    </div>

    <div class="amount" id="amountDisplay">Valor livre</div>
    <div class="city" id="cityDisplay">SUA CIDADE - UF</div>

    <div id="qrcode"></div>

    <label for="amount">Valor (opcional)</label>
    <input id="amount" type="number" min="0.01" step="0.01" placeholder="Ex.: 50,00">

    <button class="primary" onclick="generatePix()">Gerar / atualizar Pix</button>

    <label for="pixCode">Pix copia e cola</label>
    <div class="pix-box">
      <input id="pixCode" readonly>
      <button class="secondary" style="width:110px;margin:0" onclick="copyPix()">Copiar</button>
    </div>

    <div class="status" id="status"></div>

    <button class="whatsapp" onclick="sendWhatsApp()">Enviar pelo WhatsApp</button>

    <p class="hint">
      O botão do WhatsApp abre uma mensagem pronta com o valor e o Pix copia e cola.
      O pagamento é confirmado pelo seu banco, não por esta página.
    </p>
  </main>

  <!-- Biblioteca QR Code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>
    /*
      =========================
      CONFIGURAÇÃO FIXA
      =========================
      Troque somente os valores abaixo.
    */
    const PIX_KEY = "SUA_CHAVE_PIX_AQUI";
    const RECIPIENT_NAME = "SEU NOME";
    const CITY = "SUA CIDADE";
    const UF = "GO";

    // ID da transação. Para QR estático, use "***" ou um identificador curto.
    const TXID = "***";

    document.getElementById("recipient").textContent = RECIPIENT_NAME;
    document.getElementById("cityDisplay").textContent = CITY + " - " + UF;

    function crc16(payload) {
      let crc = 0xFFFF;
      for (let i = 0; i < payload.length; i++) {
        crc ^= payload.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
          crc &= 0xFFFF;
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, "0");
    }

    function field(id, value) {
      return id + String(value.length).padStart(2, "0") + value;
    }

    function normalize(text, max) {
      return text
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .replace(/[^A-Z0-9 $%*+\-./:]/g, "")
        .substring(0, max);
    }

    function buildPix(amount) {
      const merchantName = normalize(RECIPIENT_NAME, 25);
      const merchantCity = normalize(CITY, 15);
      const key = PIX_KEY.trim();

      if (!key || key === "SUA_CHAVE_PIX_AQUI") {
        throw new Error("Configure sua chave Pix no código.");
      }

      const gui = field("00", "BR.GOV.BCB.PIX");
      const pixKey = field("01", key);
      const merchantAccount = field("26", gui + pixKey);

      let payload =
        field("00", "01") +
        merchantAccount +
        field("52", "0000") +
        field("53", "986");

      if (amount && Number(amount) > 0) {
        payload += field("54", Number(amount).toFixed(2));
      }

      payload +=
        field("58", "BR") +
        field("59", merchantName) +
        field("60", merchantCity) +
        field("62", field("05", TXID));

      payload += "6304";
      payload += crc16(payload);

      return payload;
    }

    function generatePix() {
      try {
        const amount = document.getElementById("amount").value;
        const pix = buildPix(amount);

        document.getElementById("pixCode").value = pix;
        document.getElementById("amountDisplay").textContent =
          amount && Number(amount) > 0
            ? Number(amount).toLocaleString("pt-BR", {style:"currency", currency:"BRL"})
            : "Valor livre";

        const qr = document.getElementById("qrcode");
        qr.innerHTML = "";
        new QRCode(qr, {
          text: pix,
          width: 230,
          height: 230,
          correctLevel: QRCode.CorrectLevel.M
        });

        document.getElementById("status").textContent = "Pix gerado com sucesso.";
      } catch (e) {
        document.getElementById("status").textContent = e.message;
      }
    }

    async function copyPix() {
      const input = document.getElementById("pixCode");
      if (!input.value) generatePix();
      try {
        await navigator.clipboard.writeText(input.value);
        document.getElementById("status").textContent = "Pix copia e cola copiado!";
      } catch {
        input.select();
        document.execCommand("copy");
        document.getElementById("status").textContent = "Pix copia e cola copiado!";
      }
    }

    function sendWhatsApp() {
      const amount = document.getElementById("amount").value;
      if (!document.getElementById("pixCode").value) generatePix();

      const pix = document.getElementById("pixCode").value;
      const valor = amount && Number(amount) > 0
        ? Number(amount).toLocaleString("pt-BR", {style:"currency", currency:"BRL"})
        : "valor livre";

      const message =
        `Olá! Segue meu Pix para pagamento.\n\n` +
        `💰 Valor: ${valor}\n` +
        `📱 Pix copia e cola:\n${pix}\n\n` +
        `Obrigado!`;

      window.open("https://wa.me/?text=" + encodeURIComponent(message), "_blank");
    }

    generatePix();
  </script>
</body>
</html>
